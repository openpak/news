name: pr

# Isolated contribution check: untrusted fork code builds and tests here with
# no organization secrets and no self-hosted runner. Runs only on
# pull_request (never pull_request_target), on GitHub-hosted runners, with a
# read-only token. Release stays on release.yml (tags + manual dispatch).
# Postgres rides as a service container (synthetic test database only).
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: news_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEWS_TEST_DATABASE: postgres://news:secret@127.0.0.1:5432/news_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: test -z "$(gofmt -l .)"
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go test -count=1 ./...
